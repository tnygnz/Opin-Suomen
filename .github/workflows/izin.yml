name: izin
'on':
  push:
    paths:
      - '.github/workflows/izin.yml'
permissions:
  contents: write
jobs:
  izin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mode 100755 + akis dosyasini sil
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git update-index --chmod=+x yayinla.sh
          git rm -q .github/workflows/izin.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
            exit 0
          fi
          git commit -m "yayinla.sh çalıştırılabilir olsun"
          git push
