name: zip-ac

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Zip'in doğrudan https indirme adresi"
        type: string
        required: false
        default: ""
      release_surum:
        description: "Release etiketi (boşsa en son sürüm)"
        type: string
        required: false
        default: ""
      release_dosya:
        description: "Release ekinin adı; doluysa aranır"
        type: string
        required: false
        default: ""
      artifact_run_id:
        description: "Zip artefaktını taşıyan çalışma id"
        type: string
        required: false
        default: ""
      artifact_name:
        description: "Artefakt adı (artefakt modu)"
        type: string
        required: false
        default: "zip-paket"
      hedef:
        description: "Zip'in kopyalanacağı depodaki dizin"
        type: string
        required: false
        default: "sanat"
      mesaj:
        description: "Commit mesajı eki (isteğe bağlı)"
        type: string
        required: false
        default: ""

jobs:
  ac:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depoyu klonla
        uses: actions/checkout@v4

      - name: Zip edin
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          RELEASE_SURUM: ${{ inputs.release_surum }}
          RELEASE_DOSYA: ${{ inputs.release_dosya }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PAKET="$RUNNER_TEMP/paket.zip"

          if [ -n "$ZIP_URL" ]; then
            echo "Indiriliyor: $ZIP_URL"
            curl -sSL "$ZIP_URL" -o "$PAKET"
          elif [ -n "$RELEASE_SURUM" ] || [ -n "$RELEASE_DOSYA" ]; then
            REPO="${{ github.repository }}"
            TAG="$RELEASE_SURUM"
            if [ -z "$TAG" ]; then
              TAG=$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')
            fi
            if [ -n "$RELEASE_DOSYA" ]; then
              gh release download "$TAG" -R "$REPO" -p "$RELEASE_DOSYA" -O "$PAKET"
            else
              gh release download "$TAG" -R "$REPO" -p "*.zip" -O "$PAKET"
            fi
          elif [ -n "$ARTIFACT_RUN_ID" ]; then
            gh run download "$ARTIFACT_RUN_ID" -R "${{ github.repository }}" -n "$ARTIFACT_NAME" -D "$RUNNER_TEMP/art"
            Z=$(find "$RUNNER_TEMP/art" -name "*.zip" | head -n 1)
            [ -n "$Z" ] && mv "$Z" "$PAKET"
          else
            echo "Kaynak belirtilmedi!"
            exit 1
          fi

      - name: Zip ac ve kopyala
        env:
          HEDEF: ${{ inputs.hedef }}
        run: |
          set -euo pipefail
          PAKET="$RUNNER_TEMP/paket.zip"
          HEDEF_DIZIN="${HEDEF:-sanat}"
          mkdir -p "$HEDEF_DIZIN"
          UNPACK="$RUNNER_TEMP/unpack"
          rm -rf "$UNPACK"
          mkdir -p "$UNPACK"
          unzip -q "$PAKET" -d "$UNPACK"
          IC_ZIP=$(find "$UNPACK" -mindepth 1 -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$IC_ZIP" ]; then
            IC_UNPACK="$RUNNER_TEMP/ic_unpack"
            rm -rf "$IC_UNPACK"
            mkdir -p "$IC_UNPACK"
            unzip -q "$IC_ZIP" -d "$IC_UNPACK"
            KOK="$IC_UNPACK"
          else
            KOK="$UNPACK"
          fi
          ICOUT=$(find "$KOK" -mindepth 1 -maxdepth 1 -type d)
          if [ $(echo "$ICOUT" | wc -l) -eq 1 ] && [ -n "$ICOUT" ]; then
            KOK="$ICOUT"
          fi
          cp -r "$KOK"/* "$HEDEF_DIZIN"/

      - name: Degisiklik var mi
        id: diff
        env:
          HEDEF: ${{ inputs.hedef }}
        run: |
          set -euo pipefail
          HEDEF_DIZIN="${HEDEF:-sanat}"
          git add -A -- "$HEDEF_DIZIN"
          if git diff --cached --quiet; then
            echo "var=false" >> "$GITHUB_OUTPUT"
          else
            echo "var=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit ve push
        if: steps.diff.outputs.var == 'true'
        env:
          MESAJ: ${{ inputs.mesaj }}
          HEDEF: ${{ inputs.hedef }}
        run: |
          set -euo pipefail
          HEDEF_DIZIN="${HEDEF:-sanat}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ILETI="${MESAJ:-zip-ac: $HEDEF_DIZIN icerigi guncellendi}"
          git commit -m "$ILETI"
          git push

      - name: Ozet
        if: always()
        env:
          HEDEF: ${{ inputs.hedef }}
        run: |
          HEDEF_DIZIN="${HEDEF:-sanat}"
          echo "### zip-ac" >> "$GITHUB_STEP_SUMMARY"
          echo "- hedef: \`$HEDEF_DIZIN\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- degisiklik: \`${{ steps.diff.outputs.var }}\`" >> "$GITHUB_STEP_SUMMARY"
