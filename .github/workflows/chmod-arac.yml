name: chmod-arac

# Tek kullanımlık: içerik API'si 100755 bitini veremediği için araçlara
# çalıştırma bitini ekler. İşi bitince bu dosya silinir.

'on':
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chmod:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Çalıştırma biti
        run: |
          set -euo pipefail
          git update-index --chmod=+x tek.sh guncelle.sh tools/ayna.sh
          if git diff --cached --quiet; then echo "zaten çalıştırılabilir"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore: araclara calistirma biti (100755)"
          git push origin HEAD:main
