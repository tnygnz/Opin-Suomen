name: duzelt
'on':
  push:
    paths:
      - '.github/workflows/duzelt.yml'
permissions:
  contents: write
jobs:
  duzelt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: İki dosyayı düzelt
        run: python3 .github/scripts/duzelt.py
      - name: Commit ve push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/duzelt.yml .github/scripts/duzelt.py
          git add -A
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
            exit 0
          fi
          git commit -m "sanat: masaüstü sekme çubuğu hizası ve hero onay ikonu"
          git push
